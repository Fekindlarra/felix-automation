<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel FELIX — Generador de Reportes</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --white: #ffffff;
            --gray-dark: #4d4d4d;
            --gray-light: #f0f0f0;
            --accent-green: #00ff00;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--black);
            color: var(--white);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 1px solid var(--gray-dark);
            padding-bottom: 40px;
        }

        h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .divider-accent {
            height: 2px;
            background: var(--accent-green);
            width: 100px;
            margin: 16px auto;
        }

        .subtitle {
            font-size: 12px;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--gray-dark);
            padding-bottom: 24px;
        }

        .tab-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: none;
            border: none;
            color: var(--gray-dark);
            cursor: pointer;
            padding: 8px 0;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--white);
            border-bottom: 2px solid var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-dark);
            margin-bottom: 8px;
        }

        input, textarea {
            background: var(--gray-dark);
            border: 1px solid #333;
            color: var(--white);
            padding: 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13px;
        }

        input:focus, textarea:focus {
            outline: none;
            background: #555;
            border-color: var(--accent-green);
        }

        button {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 24px;
            background: var(--white);
            color: var(--black);
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-green);
        }

        .status-message {
            padding: 16px;
            margin-bottom: 24px;
            border-left: 2px solid var(--accent-green);
            background: rgba(0, 255, 0, 0.05);
            display: none;
        }

        .status-message.success {
            display: block;
        }

        .status-message.error {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
            color: #ff6b6b;
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .report-card {
            border: 1px solid var(--gray-dark);
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
        }

        .report-card h3 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .score-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FELIX</h1>
            <div class="divider-accent"></div>
            <p class="subtitle">Panel de Generación de Reportes</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('generate')">Generar</button>
            <button class="tab-btn" onclick="switchTab('batch')">Batch</button>
            <button class="tab-btn" onclick="switchTab('reports')">Reportes</button>
        </div>

        <div id="generate" class="tab-content active">
            <h2 style="font-family: 'IBM Plex Mono'; font-size: 24px; margin-bottom: 32px; text-transform: uppercase;">Crear Nuevo Reporte</h2>
            <div id="generateStatus" class="status-message"></div>
            <form id="generateForm">
                <div class="form-group">
                    <div><label>Nombre del Cliente</label><input type="text" name="client_name" placeholder="Tienda Online ABC" required></div>
                    <div><label>Email</label><input type="email" name="client_email" placeholder="abc@example.com" required></div>
                </div>
                <div class="form-group">
                    <div><label>Score (0-100)</label><input type="number" name="score" min="0" max="100" value="81" required></div>
                    <div><label>Procesos Manuales</label><input type="number" name="processes" value="47" required></div>
                </div>
                <div class="form-group">
                    <div><label>APIs Inactivas</label><input type="number" name="apis" value="12" required></div>
                    <div><label>h/Semana Perdidas</label><input type="number" name="hours" step="0.1" value="4.2" required></div>
                </div>
                <button type="submit" style="width: 100%; padding: 16px;">Generar Reporte</button>
            </form>
        </div>

        <div id="batch" class="tab-content">
            <h2 style="font-family: 'IBM Plex Mono'; font-size: 24px; margin-bottom: 32px;">Procesar Múltiples</h2>
            <div id="batchStatus" class="status-message"></div>
            <div class="form-group full">
                <label>JSON Array</label>
                <textarea id="batchInput" style="height: 200px; font-family: 'IBM Plex Mono'" placeholder='[{"client_name":"...","client_email":"...","score":81,...}]'></textarea>
            </div>
            <button onclick="submitBatch()" style="width: 100%; padding: 16px;">Procesar Lote</button>
        </div>

        <div id="reports" class="tab-content">
            <h2 style="font-family: 'IBM Plex Mono'; font-size: 24px; margin-bottom: 32px;">Reportes</h2>
            <button onclick="loadReports()" style="margin-bottom: 24px;">Actualizar</button>
            <div id="reportsList" class="reports-grid"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api";

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
            if (name === 'reports') loadReports();
        }

        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('generateStatus');
            const form = new FormData(e.target);
            const data = {
                client_name: form.get('client_name'),
                client_email: form.get('client_email'),
                score: parseInt(form.get('score')),
                processes: parseInt(form.get('processes')),
                apis: parseInt(form.get('apis')),
                hours: parseFloat(form.get('hours')),
                send_email: false
            };

            status.textContent = '⏳ Generando...';
            status.classList.add('success');

            try {
                const res = await fetch(`${API_URL}/reports/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    status.innerHTML = `✅ <strong>${result.message}</strong><br><a href="${API_URL}/reports/download/${result.report_id}" style="color: var(--accent-green);">Descargar PDF</a>`;
                    e.target.reset();
                } else {
                    status.classList.add('error');
                    status.textContent = `❌ ${result.error}`;
                }
            } catch (err) {
                status.classList.add('error');
                status.textContent = `❌ Error: ${err.message}`;
            }
        });

        async function submitBatch() {
            const status = document.getElementById('batchStatus');
            try {
                const reports = JSON.parse(document.getElementById('batchInput').value);
                status.textContent = `⏳ Procesando ${reports.length} reportes...`;
                status.classList.add('success');

                const res = await fetch(`${API_URL}/reports/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reports, send_emails: false })
                });
                const result = await res.json();
                if (res.ok) {
                    status.innerHTML = `✅ ${result.message}`;
                } else {
                    status.classList.add('error');
                    status.textContent = `❌ ${result.error}`;
                }
            } catch (err) {
                status.classList.add('error');
                status.textContent = `❌ ${err.message}`;
            }
        }

        async function loadReports() {
            try {
                const res = await fetch(`${API_URL}/reports`);
                const result = await res.json();
                const list = document.getElementById('reportsList');
                if (result.reports.length === 0) {
                    list.innerHTML = '<p style="grid-column:1/-1; color:var(--gray-dark);">Sin reportes</p>';
                } else {
                    list.innerHTML = result.reports.map(r => `
                        <div class="report-card">
                            <h3>${r.client_name}</h3>
                            <div class="score-badge">${r.score}</div>
                            <p style="font-size: 11px; color: var(--gray-dark);">
                                Procesos: ${r.processes} | APIs: ${r.apis}<br>
                                ${new Date(r.created_at).toLocaleDateString('es-ES')}
                            </p>
                            <a href="${API_URL}/reports/download/${r.id}" style="color: var(--accent-green); text-decoration: none;">↓ Descargar</a>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
