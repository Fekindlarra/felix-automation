name: FASE 15 CI/CD Pipeline

on:
  push:
    branches: [develop, main, stage]
  pull_request:
    branches: [develop, main]

jobs:
  test-track-a:
    name: Track A - React Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend/mobile
          npm install

      - name: Lint TypeScript
        run: |
          cd frontend/mobile
          npm run lint

      - name: Type check
        run: |
          cd frontend/mobile
          npm run type-check

      - name: Run tests
        run: |
          cd frontend/mobile
          npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/mobile/coverage

  test-track-b:
    name: Track B - Python ML Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-fase15.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fase15.txt

      - name: Lint with pylint
        run: |
          pylint backend/api/*.py --disable=missing-docstring --exit-zero

      - name: Run tests
        run: |
          cd backend/api
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/api
          flags: python

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r backend/ -ll -f json -o bandit-report.json || true
          cat bandit-report.json

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Track A build
        run: |
          cd frontend/mobile
          npm install --ci
          npm run build-web || echo "Build not available in preview"

      - name: Check Track B API startup
        run: |
          python -m py_compile backend/api/main.py
          python -m py_compile backend/api/config.py
          python -m py_compile backend/api/models.py

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-track-a, test-track-b]
    if: always()
    steps:
      - uses: actions/download-artifact@v3
      - name: Merge coverage reports
        run: |
          echo "Coverage results available"
