[pytest]
# Pytest configuration for FASE 15
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    fase_legacy: Legacy FASE phase tests
    phase3: Phase 3 specific tests
